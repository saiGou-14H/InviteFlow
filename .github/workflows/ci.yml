name: CI
on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: inviteflow_test
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U postgres -d inviteflow_test'
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      INVITEFLOW_DATABASE_URL: postgresql+asyncpg://postgres:ci-only-password@127.0.0.1:5432/inviteflow_test
      INVITEFLOW_TEST_DATABASE_URL: postgresql+asyncpg://postgres:ci-only-password@127.0.0.1:5432/inviteflow_test
      INVITEFLOW_SESSION_SECRET: ci-only-session-secret-not-for-production-123456
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.12.21
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check src tests
      - run: uv run mypy src
      - run: uv run alembic upgrade head && uv run alembic check
      - run: uv run alembic downgrade base && uv run alembic upgrade head
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck && npm test && npm run build

  browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: inviteflow_test
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U postgres -d inviteflow_test'
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      INVITEFLOW_DATABASE_URL: postgresql+asyncpg://postgres:ci-only-password@127.0.0.1:5432/inviteflow_test
      INVITEFLOW_SESSION_SECRET: ci-only-session-secret-not-for-production-123456
      INVITEFLOW_PUBLIC_ORIGIN: http://127.0.0.1:5173
      INVITEFLOW_COOKIE_SECURE: 'false'
      INVITEFLOW_TEST_ADMIN_USERNAME: browser-admin
      INVITEFLOW_TEST_ADMIN_PASSWORD: ci-only-browser-admin-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install uv==0.12.21
      - run: uv sync --frozen --extra dev && uv run alembic upgrade head
      - name: Create disposable test administrator
        run: >-
          uv run python -c "import asyncio, os; from inviteflow.cli import manage_admin;
          asyncio.run(manage_admin('create', os.environ['INVITEFLOW_TEST_ADMIN_USERNAME'],
          os.environ['INVITEFLOW_TEST_ADMIN_PASSWORD']))"
      - run: npm ci --prefix frontend
      - run: cd frontend && npx playwright install --with-deps chromium
      - name: Start test services
        run: |
          uv run uvicorn inviteflow.app:create_app --factory --host 127.0.0.1 --port 8000 > /tmp/inviteflow-api.log 2>&1 &
          npm run dev --prefix frontend -- --host 127.0.0.1 --port 5173 > /tmp/inviteflow-web.log 2>&1 &
          curl --fail --retry 15 --retry-delay 1 --retry-connrefused http://127.0.0.1:8000/readyz
          curl --fail --retry 15 --retry-delay 1 --retry-connrefused http://127.0.0.1:5173/
      - run: cd frontend && npx playwright test
