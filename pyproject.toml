[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "inviteflow"
version = "0.1.0"
description = "InviteFlow invitation redemption and task orchestration platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "InviteFlow contributors" }]
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.5,<3",
  "uvicorn[standard]>=0.30,<1",
  "alembic>=1.13,<2",
  "asyncpg>=0.29,<1",
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "argon2-cffi>=23.1,<26",
]

[project.optional-dependencies]
providers = [
  "httpx>=0.27,<1",
]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[project.scripts]
inviteflow-api = "inviteflow.main:run"
inviteflow-admin = "inviteflow.cli:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
inviteflow = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: requires isolated INVITEFLOW_TEST_DATABASE_URL PostgreSQL database"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
